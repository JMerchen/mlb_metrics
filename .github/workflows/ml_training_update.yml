name: ML Signal Training Update

on:
  schedule:
    - cron: "0 14 * * 0"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: |
          pytest

      - name: Create output folders
        run: |
          mkdir -p data/models
          mkdir -p data/raw/lahman

      - name: Train DFS ML models (hitter, pitcher H allowed, pitcher BB)
        run: |
          python scripts/train_dfs_ml_models.py

      - name: Convert Lahman_Raw CSVs to parquet
        run: |
          python scripts/fetch_lahman.py

      - name: Train Age Curves HR9 model
        run: |
          python scripts/train_age_curve_hr9_model.py

      - name: Train hitter hit-probability model
        run: |
          python scripts/train_hitter_hit_model.py

      - name: Train game-pick calibration
        run: |
          python scripts/train_game_pick_calibration.py

      - name: Commit updates
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add data/models/

          git commit -m "ML signal training update" || echo "No changes"

          # Retry with a rebase before each attempt. This job runs 50+
          # minutes of training before reaching this step, so a real code
          # push to the same branch in the meantime easily wins the race
          # (confirmed twice in practice: runs 32759747063 and 32766340800
          # both lost a real trained-artifact commit to exactly this - a
          # plain `git push` with no retry). data/models/ is the only path
          # this step ever touches, so rebasing onto whatever else landed
          # on the branch is always safe - nothing else in this repo
          # commits to that same path.
          branch=$(git rev-parse --abbrev-ref HEAD)
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push attempt $attempt failed - pulling/rebasing and retrying..."
            git pull --rebase origin "$branch"
            sleep 5
          done
          echo "::error::Failed to push after 5 attempts"
          exit 1
