name: ML Signal Training Update

on:
  schedule:
    - cron: "0 14 * * 0"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: |
          pytest

      - name: Create output folders
        run: |
          mkdir -p data/models
          mkdir -p data/raw/lahman

      - name: Train DFS ML models (hitter, pitcher H allowed, pitcher BB)
        run: |
          python scripts/train_dfs_ml_models.py

      - name: Convert Lahman_Raw CSVs to parquet
        run: |
          python scripts/fetch_lahman.py

      - name: Train Age Curves HR9 model
        run: |
          python scripts/train_age_curve_hr9_model.py

      - name: Train hitter hit-probability model
        run: |
          python scripts/train_hitter_hit_model.py

      - name: Commit updates
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add data/models/

          git commit -m "ML signal training update" || echo "No changes"

          git push
