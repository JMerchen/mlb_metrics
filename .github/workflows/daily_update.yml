name: Daily Update

on:

schedule:
- cron: "0 14 * * *"

workflow_dispatch:

jobs:

update:

runs-on: ubuntu-latest

permissions:
  contents: write

steps:

  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Python
    uses: actions/setup-python@v5

    with:
      python-version: "3.12"

  - name: Install dependencies

    run: |

      python -m pip install --upgrade pip

      pip install \
        pandas \
        numpy \
        pybaseball

  - name: Create output folders

    run: |

      mkdir -p docs/data

  - name: Run model

    run: |

      python scripts/model.py

  - name: Commit updates

    run: |

      git config user.name "github-actions"

      git config user.email "actions@github.com"

      git add docs/data/

      git commit \
        -m "Daily update" \
        || echo "No changes"

      git push
