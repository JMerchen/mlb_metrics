name: Debug statsapi

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Date to query (YYYY-MM-DD). Leave blank for today."
        required: false

jobs:
  debug:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install MLB-StatsAPI

      - name: Print statsapi response shape
        run: |
          python scripts/debug_statsapi.py "${{ inputs.date }}"
