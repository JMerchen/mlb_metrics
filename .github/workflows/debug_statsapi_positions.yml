name: Debug statsapi positions

on:
  workflow_dispatch:
    inputs:
      ids:
        description: "Comma-separated MLBAM player ids to query. Leave blank for defaults."
        required: false

jobs:
  debug:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install MLB-StatsAPI

      - name: Print statsapi people response shape
        run: |
          python scripts/debug_statsapi_positions.py "${{ inputs.ids }}"
