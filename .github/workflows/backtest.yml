name: Backtest

on:
  workflow_dispatch:
    inputs:
      fetch_missing:
        description: "Fetch outcome data for historical dates not already persisted in data/raw/"
        type: boolean
        default: true

jobs:
  backtest:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # git_backtest.py replays the full commit history of docs/data/wave.csv,
          # which needs more than the default shallow (1-commit) checkout.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: |
          pytest

      - name: Create output folders
        run: |
          mkdir -p docs/data
          mkdir -p data/raw
          mkdir -p data/predictions

      - name: Run backtest
        run: |
          if [ "${{ inputs.fetch_missing }}" = "true" ]; then
            python scripts/run_backtest.py --fetch-missing
          else
            python scripts/run_backtest.py
          fi

      - name: Commit updates
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add docs/data/backtest_summary.csv docs/data/beat_the_streak_picks.csv docs/data/beat_the_streak_summary.csv data/raw/ data/predictions/

          git commit -m "Run backtest" || echo "No changes"

          git push
