name: NFL Weekly Update

on:
  # Off the top of the hour (`:17`) to avoid peak scheduled-workflow load,
  # same as daily_update.yml. Four runs a week, not daily: games cluster
  # Thursday/Sunday/Monday, and Actions minutes are a finite budget.
  schedule:
    # Times are UTC; Arizona is UTC-7 all year.
    # Tuesday 13:17 UTC (6:17 AM Arizona): after Monday Night Football is
    # final - grades last week and logs every game's pick for the new week
    # BEFORE the injury report.
    - cron: "17 13 * * 2"
    # Thursday, Saturday and Monday 15:17 UTC (8:17 AM Arizona): each
    # game's final injury report is out by the morning of it (Thursday) or
    # the day before (Saturday, for Sunday) - these runs reprice the games
    # played that day or the next with it (the pick AFTER the injury
    # report) and refresh the player props for every game still to come.
    - cron: "17 15 * * 4"
    - cron: "17 15 * * 6"
    - cron: "17 15 * * 1"
  workflow_dispatch:
    inputs:
      season:
        description: "Season to run (defaults to config.NFL_SEASON)"
        required: false

jobs:
  update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: |
          pytest

      - name: Create output folders
        run: |
          mkdir -p docs/data
          mkdir -p data/raw/nfl
          mkdir -p data/predictions

      - name: Run NFL game picks pipeline
        run: |
          if [ -n "${{ inputs.season }}" ]; then
            python scripts/nfl_pipeline.py --season "${{ inputs.season }}"
          else
            python scripts/nfl_pipeline.py
          fi

      - name: Build NFL Stats tab data (schedules, team stats, player views)
        run: |
          if [ -n "${{ inputs.season }}" ]; then
            python scripts/build_nfl_stats.py --season "${{ inputs.season }}"
          else
            python scripts/build_nfl_stats.py
          fi

      - name: Commit updates
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          # NOTE: every real output path this pipeline writes must be
          # listed here. A real, confirmed bug (2026-09-16):
          # docs/data/nfl_player_props.csv was written every week for
          # weeks and silently dropped before every commit because it was
          # missing from this list. nfl_player_props_results.csv and
          # nfl_prop_predictions.csv are the same class of file - add new
          # outputs here at the same time they're wired into the pipeline.
          git add docs/data/nfl_game_picks_picks.csv docs/data/nfl_game_picks_summary.csv docs/data/nfl_game_picks_summary_by_version.csv docs/data/nfl_player_props.csv docs/data/nfl_position_floors.csv data/raw/nfl/ data/predictions/nfl_game_predictions.csv
          # These two are only written once there's real data for them
          # (a real first prop-logging run, and a real first resolved
          # pick) - `git add` on a path that doesn't exist yet fails the
          # whole step under `bash -e`, so guard each one, the same way
          # consensus_rankings_update.yml's own commit step already does.
          for f in data/predictions/nfl_prop_predictions.csv docs/data/nfl_player_props_results.csv docs/data/nfl_team_units.csv docs/data/nfl_team_schedule.csv docs/data/nfl_team_stats.csv docs/data/nfl_player_stats.csv docs/data/nfl_whatif.json docs/data/nfl_whatif_last_week.json; do
            [ -f "$f" ] && git add "$f"
          done

          git commit -m "NFL weekly update" || echo "No changes"

          # Retry with a rebase before each attempt - same real push-race
          # fix as daily_update.yml's own "Commit updates" step.
          branch=$(git rev-parse --abbrev-ref HEAD)
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push attempt $attempt failed - pulling/rebasing and retrying..."
            git pull --rebase origin "$branch"
            sleep 5
          done
          echo "::error::Failed to push after 5 attempts"
          exit 1
