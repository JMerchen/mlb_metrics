name: Backfill Statcast season

# One-time (re-runnable) seed for scripts/backfill_statcast_season.py -
# persists a full past MLB season's real pitch-by-pitch Statcast data to
# data/raw/statcast_<season>.parquet, the same format the daily pipeline
# already builds up incrementally for the current season. This project's
# own dev sandbox blocks Statcast's real data source directly; this
# workflow runner has normal internet access. A full season is a real,
# possibly multi-hour fetch (chunked by calendar month, resilient to a
# single bad chunk - see the script's own docstring), so this job's
# timeout is set generously rather than left at the platform default.

on:
  workflow_dispatch:
    inputs:
      season:
        description: "Season year to backfill (e.g. 2025)"
        required: true
      start_date:
        description: "Optional override (YYYY-MM-DD) - defaults to March 18 of season"
        required: false
      end_date:
        description: "Optional override (YYYY-MM-DD) - defaults to September 28 of season"
        required: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 340

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pybaseball pandas pyarrow

      - name: Backfill real Statcast season
        run: |
          ARGS="--season ${{ inputs.season }}"
          if [ -n "${{ inputs.start_date }}" ]; then
            ARGS="$ARGS --start-date ${{ inputs.start_date }}"
          fi
          if [ -n "${{ inputs.end_date }}" ]; then
            ARGS="$ARGS --end-date ${{ inputs.end_date }}"
          fi
          python scripts/backfill_statcast_season.py $ARGS

      - name: Commit updates
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add data/raw/

          git commit -m "Backfill real Statcast data for season ${{ inputs.season }}" || echo "No changes"

          git push
