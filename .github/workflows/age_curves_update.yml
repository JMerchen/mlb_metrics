name: Age Curves Update

on:
  schedule:
    - cron: "0 13 * * 0"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: |
          pytest

      - name: Create output folders
        run: |
          mkdir -p docs/data
          mkdir -p data/raw/lahman

      - name: Convert Lahman_Raw CSVs to parquet
        run: |
          python scripts/fetch_lahman.py

      - name: Build Age Curves data
        run: |
          python scripts/build_age_curves.py

      - name: Commit updates
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add docs/data/age_curve_projections.csv docs/data/age_curve_comparables.csv docs/data/age_curve_league.csv docs/data/age_curve_player_history.csv data/raw/lahman/

          git commit -m "Age Curves data update" || echo "No changes"

          # Retry with a rebase before each attempt - same real push-race
          # fix as ml_training_update.yml's own "Commit updates" step
          # (confirmed twice in practice there).
          branch=$(git rev-parse --abbrev-ref HEAD)
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push attempt $attempt failed - pulling/rebasing and retrying..."
            git pull --rebase origin "$branch"
            sleep 5
          done
          echo "::error::Failed to push after 5 attempts"
          exit 1
