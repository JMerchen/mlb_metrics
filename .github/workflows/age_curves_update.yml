name: Age Curves Update

on:
  schedule:
    - cron: "0 13 * * 0"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: |
          pytest

      - name: Create output folders
        run: |
          mkdir -p docs/data
          mkdir -p data/raw/lahman

      - name: Refresh Lahman data
        run: |
          python scripts/fetch_lahman.py

      - name: Build Age Curves data
        run: |
          python scripts/build_age_curves.py

      - name: Commit updates
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add docs/data/age_curve_projections.csv docs/data/age_curve_comparables.csv docs/data/age_curve_league.csv data/raw/lahman/

          git commit -m "Age Curves data update" || echo "No changes"

          git push
