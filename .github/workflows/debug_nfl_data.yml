name: Debug nflreadpy

on:
  workflow_dispatch:
    inputs:
      season:
        description: "Season to query (e.g. 2025). Leave blank for last completed season."
        required: false

jobs:
  debug:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # pyarrow is needed for polars' .to_pandas() (nflreadpy returns
          # Polars DataFrames by default) - confirmed via real run
          # 30674712701, which got as far as printing
          # get_current_season()/get_current_week() before failing on the
          # first .to_pandas() call. Already a top-level dependency in
          # requirements.txt for Statcast persistence, so no new package
          # family for the eventual nfl_data.py module either.
          pip install nflreadpy pandas pyarrow

      - name: Print nflreadpy response shapes
        run: |
          python scripts/debug_nfl_data.py "${{ inputs.season }}"
