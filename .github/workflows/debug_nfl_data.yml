name: Debug nfl_data_py

on:
  workflow_dispatch:
    inputs:
      season:
        description: "Season to query (e.g. 2025). Leave blank for last completed season."
        required: false

jobs:
  debug:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nfl_data_py pandas

      - name: Print nfl_data_py response shapes
        run: |
          python scripts/debug_nfl_data.py "${{ inputs.season }}"
