name: Debug nflreadpy

on:
  workflow_dispatch:
    inputs:
      season:
        description: "Season to query (e.g. 2025). Leave blank for last completed season."
        required: false

jobs:
  debug:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nflreadpy pandas

      - name: Print nflreadpy response shapes
        run: |
          python scripts/debug_nfl_data.py "${{ inputs.season }}"
