name: Backfill college basketball odds

# Runs scripts/backfill_cbb_odds.py for one season: every Division I game's
# sportsbook spread, total and moneylines from ESPN's core API, persisted
# to data/raw/market_odds/espn_cbb_odds_<season>.parquet for testing the
# college ratings against a real line (mlb_metrics.cbb_odds). This
# project's own sandbox cannot reach ESPN; this runner can. The script
# saves as it goes, so a re-run after a timeout resumes rather than
# restarts.

on:
  workflow_dispatch:
    inputs:
      season:
        description: "Season to backfill: the year it ends in (e.g. 2026 for 2025-26)"
        required: true
      limit:
        description: "Optional: only the latest N games (a probe)"
        required: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas pyarrow numpy

      - name: Backfill odds
        run: |
          ARGS="--season ${{ inputs.season }}"
          if [ -n "${{ inputs.limit }}" ]; then ARGS="$ARGS --limit ${{ inputs.limit }}"; fi
          python scripts/backfill_cbb_odds.py $ARGS

      - name: Commit odds
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/raw/market_odds/ || true
          git commit -m "Backfill college basketball odds for season ${{ inputs.season }}" || echo "No changes"
          branch=$(git rev-parse --abbrev-ref HEAD)
          for attempt in 1 2 3 4 5 6 7 8; do
            if git push; then
              exit 0
            fi
            echo "Push attempt $attempt failed - pulling/rebasing and retrying..."
            git pull --rebase origin "$branch"
            sleep $((RANDOM % 20 + 5))
          done
          echo "::error::Failed to push after 8 attempts"
          exit 1
