name: CI

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run consensus_board.js unit tests
        run: node --test docs/consensus_board.test.js

      - name: Run player_props.js unit tests
        run: node --test docs/player_props.test.js

      - name: Run summary_render.js unit tests
        run: node --test docs/summary_render.test.js

      - name: Run nfl_units.js unit tests
        run: node --test docs/nfl_units.test.js

      - name: Run prop_cards.js unit tests
        run: node --test docs/prop_cards.test.js
      - name: Run mlb_render.js unit tests
        run: node --test docs/mlb_render.test.js

      - name: Run nfl_stats.js unit tests
        run: node --test docs/nfl_stats.test.js

      - name: Run age_render.js unit tests
        run: node --test docs/age_render.test.js

      - name: Run nfl_whatif.js unit tests
        run: node --test docs/nfl_whatif.test.js

      - name: Run payroll_render.js unit tests
        run: node --test docs/payroll_render.test.js

      - name: Run install.js / sw.js unit tests
        run: node --test docs/install.test.js

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: |
          pytest
