name: CI

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run dfs_solver.js unit tests
        run: node --test docs/dfs_solver.test.js

      - name: Run nfl_dfs_solver.js unit tests
        run: node --test docs/nfl_dfs_solver.test.js

      - name: Run nfl_draft_assistant.js unit tests
        run: node --test docs/nfl_draft_assistant.test.js

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: |
          pytest
