name: Payroll source probe (temporary)

on:
  push:
    branches: [claude/baseball-hot-cold-eval-juiywk]
    paths: [.github/workflows/payroll_probe.yml]

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch candidate pages
        run: |
          mkdir -p payroll_probe
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          for y in 1988 2005 2023 2025 2026; do
            curl -sSL -A "$UA" -o payroll_probe/cube_$y.html -w "cube $y %{http_code} %{size_download}\n" "https://thebaseballcube.com/content/payroll_year/$y" || true
          done
          curl -sSL -A "$UA" -o payroll_probe/stevetheump.html -w "ump %{http_code} %{size_download}\n" "https://stevetheump.com/Payrolls.htm" || true
          ls -la payroll_probe
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add payroll_probe
          git commit -m "Payroll source probe pages" || echo "nothing"
          git push
