name: Payroll source probe (temporary)

on:
  push:
    branches: [claude/baseball-hot-cold-eval-juiywk]
    paths: [.github/workflows/payroll_probe.yml]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Fetch every season from The Baseball Cube
        run: |
          mkdir -p payroll_probe
          python -u scripts/fetch_payrolls.py --seasons 1988-2026 --report payroll_probe/changes.csv | tee payroll_probe/fetch_log.txt
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A payroll_probe data/payroll
          git commit -m "Payroll probe: every season from The Baseball Cube" || echo "nothing"
          for attempt in 1 2 3 4 5; do
            git push && exit 0
            git pull --rebase origin claude/baseball-hot-cold-eval-juiywk
            sleep 5
          done
          exit 1
