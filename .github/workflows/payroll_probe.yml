name: Payroll source probe (temporary)

on:
  push:
    branches: [claude/baseball-hot-cold-eval-juiywk]
    paths: [.github/workflows/payroll_probe.yml, payroll_probe/probe.py]

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Fetch candidate pages
        run: |
          rm -f payroll_probe/*.html
          xvfb-run -a python payroll_probe/probe.py
          ls -la payroll_probe
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A payroll_probe
          git commit -m "Payroll source probe pages (browser)" || echo "nothing"
          git push
