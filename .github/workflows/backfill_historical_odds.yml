name: Backfill historical MLB odds

# Runs scripts/backfill_historical_odds.py for one season: every game's
# sportsbook moneylines from ESPN's core API, persisted to
# data/raw/market_odds/espn_mlb_odds_<season>.parquet for backtesting the
# game model's bets (mlb_metrics.historical_odds). This project's own
# sandbox cannot reach ESPN; this runner can. The script saves after
# every date, so a re-run after a timeout resumes rather than restarts.

on:
  workflow_dispatch:
    inputs:
      season:
        description: "Season to backfill (e.g. 2024)"
        required: true
      start_date:
        description: "Optional start (YYYY-MM-DD); defaults to the season's opening week"
        required: false
      end_date:
        description: "Optional end (YYYY-MM-DD); defaults to the regular season's last day"
        required: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas pyarrow numpy

      - name: Backfill odds
        run: |
          ARGS="--season ${{ inputs.season }}"
          if [ -n "${{ inputs.start_date }}" ]; then ARGS="$ARGS --start ${{ inputs.start_date }}"; fi
          if [ -n "${{ inputs.end_date }}" ]; then ARGS="$ARGS --end ${{ inputs.end_date }}"; fi
          python scripts/backfill_historical_odds.py $ARGS

      - name: Commit odds
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/raw/market_odds/ || true
          git commit -m "Backfill historical MLB odds for season ${{ inputs.season }}" || echo "No changes"
          branch=$(git rev-parse --abbrev-ref HEAD)
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push attempt $attempt failed - pulling/rebasing and retrying..."
            git pull --rebase origin "$branch"
            sleep 5
          done
          echo "::error::Failed to push after 5 attempts"
          exit 1
