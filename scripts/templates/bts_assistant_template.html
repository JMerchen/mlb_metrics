
<style>
/* Assistant tab: no own :root/font-loading - this section now lives
inside the full site artifact (see full_site_template.html) and inherits
style.css's real tokens/fonts, same as every other tab, instead of
maintaining a second competing theme. The .wrap/.stat-row/.panel/.pick/
.game/... "summary card" styling this page relies on now lives in the
shared style.css (the real site's own Today's Summary landing page,
docs/today.html, reuses it too) - only the chat-panel-specific rules
stay local here, since Today's Summary has no chat. */

.chat-panel{display:flex;flex-direction:column;height:460px;}
#messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;}
.msg{display:flex;flex-direction:column;gap:4px;max-width:85%;}
.msg.user{align-self:flex-end;align-items:flex-end;}
.msg.assistant{align-self:flex-start;align-items:flex-start;}
.bubble{padding:10px 13px;border-radius:12px;font-size:14px;line-height:1.5;white-space:pre-wrap;}
.msg.user .bubble{background:var(--accent);color:var(--on-accent);border-bottom-right-radius:3px;}
.msg.assistant .bubble{background:var(--bg-card);border:1px solid var(--border);border-bottom-left-radius:3px;}
.msg.assistant .bubble.thinking{color:var(--text-dim);font-style:italic;}
.msg.assistant .bubble code{font-family:var(--font-mono);font-size:.92em;background:var(--bg-hover);padding:1px 4px;border-radius:4px;}

.suggestions{display:flex;gap:8px;flex-wrap:wrap;padding:0 16px 12px;}
.suggestion{font-family:var(--font-mono);font-size:12px;background:var(--bg-card);border:1px solid var(--border);border-radius:20px;padding:6px 12px;cursor:pointer;color:var(--text-dim);transition:border-color .15s ease,color .15s ease;}
.suggestion:hover{border-color:var(--accent);color:var(--text);}

.composer{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--border);}
#input{flex:1;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;color:var(--text);font-family:var(--font);font-size:14px;resize:none;}
#input:focus{outline:none;border-color:var(--accent);}
#send{font-family:var(--font);font-weight:600;font-size:13px;background:var(--accent);color:var(--on-accent);border:none;border-radius:var(--radius-sm);padding:0 18px;cursor:pointer;transition:background .15s ease;}
#send:hover{background:var(--accent-strong);}
#send:disabled{opacity:.5;cursor:default;}

.notice{font-size:12px;color:var(--text-dim);text-align:center;padding:10px 16px 0;line-height:1.5;}
.fallback{padding:40px 20px;text-align:center;color:var(--text-dim);}
.fallback strong{color:var(--text);}
[hidden]{display:none!important;}
::-webkit-scrollbar{width:8px;}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:8px;}
</style>

<div class="wrap">
  <header>
    <h1>Today</h1>
    <span class="asof" id="asof-badge"></span>
  </header>
  <p class="subtitle">Our picks for today in one place, plus an assistant you can ask about any player, game, or how the picks are made.</p>

  <div class="stat-row" id="stat-row"></div>

  <div class="panel">
    <div class="panel-head">Beat the Streak: who gets a hit today</div>
    <div class="picks" id="picks-list"></div>
  </div>

  <div class="panel">
    <div class="panel-head with-stats"><span>Baseball games</span><span class="stat-line" id="mlb-gp-stat-line"></span></div>
    <div class="picks" id="mlb-gp-list"></div>
  </div>

  <div class="panel">
    <div class="panel-head with-stats"><span>Football games this week</span><span class="stat-line" id="nfl-gp-stat-line"></span></div>
    <div class="picks" id="nfl-gp-list"></div>
  </div>

  <div class="panel chat-panel">
    <div class="panel-head">Ask the Assistant</div>
    <div id="messages"></div>
    <div class="suggestions" id="suggestions"></div>
    <div class="composer">
      <textarea id="input" rows="1" placeholder="Ask about a player, today's picks, or the model..."></textarea>
      <button id="send">Ask</button>
    </div>
  </div>

  <p class="notice" id="notice"></p>
</div>

<script>
const ASSISTANT_DATA = /*__DATA_JSON__*/{}/*__END_DATA_JSON__*/;

function esc(s){ return String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

// The picks panels are rendered by docs/summary_render.js (with
// docs/teams.js), the same code the real site's Today page uses - this
// tab used to keep its own copy, and the two drifted apart (2026-10-10).
// Both files load as their own scripts: inlined just before this one on
// the standalone page (build_bts_assistant_page.py), or among the
// full-site artifact's shared scripts, which run after this block - hence
// waiting for DOMContentLoaded.
function renderSummaryPanels(){
  const all = ASSISTANT_DATA.streakSummary[0];
  const top = ASSISTANT_DATA.topLeaders[0];
  document.getElementById('stat-row').innerHTML = streakTilesHtml(all, top);
  document.getElementById('picks-list').innerHTML = btsPicksHtml(ASSISTANT_DATA.todaysPicks);
  for (const [sport, data] of [['mlb', ASSISTANT_DATA.mlbGamePicks], ['nfl', ASSISTANT_DATA.nflGamePicks]]) {
    const listEl = document.getElementById(`${sport}-gp-list`);
    const statEl = document.getElementById(`${sport}-gp-stat-line`);
    if (!data.asOf) {
      listEl.innerHTML = '<div class="empty-note">No games scheduled yet.</div>';
      statEl.textContent = '';
      continue;
    }
    const current = (data.summaryByVersion || []).find(r => r.model_version && r.model_version !== 'all_time') || null;
    statEl.innerHTML = gamePicksRecordHtml(data.summary[0], current);
    listEl.innerHTML = gamePicksListHtml(data.upcomingPicks, sport);
  }
  const d = new Date(ASSISTANT_DATA.asOf + 'T12:00:00');
  document.getElementById('asof-badge').textContent = Number.isNaN(d.getTime())
    ? 'Updated ' + ASSISTANT_DATA.asOf
    : 'Updated ' + d.toLocaleDateString('en-US', {weekday: 'short', month: 'short', day: 'numeric'});
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', renderSummaryPanels);
} else {
  renderSummaryPanels();
}

// --- Chat ---
const METHODOLOGY = `This is the Beat the Streak picker for a real MLB stats project. Key terms:
- WAVE: a recency-weighted at-bat-level hit rate for a batter, blended across several rolling windows (10/30/81 games and full season).
- PAVE: the pitcher equivalent - how often batters get hits against them, at-bat level.
- Game_Hit_Probability: the batter's REAL season-long observed rate of games with at least one hit (empirical, not modeled).
- Approach: Game_Hit_Probability x a WAVE-derived per-game hit probability - the main ranking score for a hitter's own form.
- Matchup_Approach: Approach adjusted for today's specific probable-pitcher matchup (a log5 blend of the batter's WAVE against that pitcher's PAVE).
- avg_batting_order / start_rate: where a batter has recently hit in the lineup, and how consistently they start.
- Wilson confidence interval: a statistically honest range for a rate, given how many real days/picks it's based on - wide with few samples, narrow with many.
- day_survival_rate: how often the day's picks (usually 2) both got a hit, i.e. would have extended a real Beat the Streak run.

Recent real finding (Sept 2026, a full-season no-lookahead backtest across 153 real dates): the automated picker's old rule excluding any batter who didn't bat in the top half of the lineup was actively hurting accuracy - batters it excluded hit 73% afterward vs 66% for the ones it kept (e.g. Javier Sanoja: hits well, bats 6th-7th for Miami, was wrongly excluded despite starting 85%+ of games). That hard rule was removed. In its place, a batter's recent lineup slot is now converted into a real, data-derived Expected_PA (leadoff hitters really do get more at-bats than #9 hitters), blended INTO the hit-probability math instead of used as a cutoff - "more expected at-bats = more chances at a hit, even at a slightly lower average." The first version used that estimate at full strength, but a 35,000-hitter-day validation found it overcorrected (real at-bats vary game to game, so a fixed number was too confident) - the shipped version blends only 30% of the raw estimate with the old flat assumption, which tested as a real, statistically significant calibration improvement (Brier score 0.2429 vs 0.2434, p<0.0001).

## MLB and NFL Automated Game Picks (separate from Beat the Streak - these predict GAME winners, not hitter streaks)

Both sports use the same structure: a team-strength engine (win% and Pythagorean win% blended across rolling windows, strength of schedule, home starting pitcher or QB continuity folded in) produces a composite win probability for each matchup; picks above a real edge threshold vs. the market moneyline get logged with a Kelly-criterion bet size (fractional, capped per-bet and per-day). Every pick is graded against the real final score and the real market closing line - "beat_closing_line_rate" is how often the model's price was more accurate than the market's own closing price, a meaningful edge test independent of whether any single bet actually won. NFL's version is newer and has far less resolved history than MLB's - treat NFL stats as preliminary and say so if asked, rather than treating a small sample as settled.

You have several tools to look up real current data beyond what's already given to you: searchPlayer and listPlayers (Beat the Streak hitters), listRecentGamePicks (MLB or NFL game-by-game history). Use them for any specific player, team, or filtered/sorted question rather than guessing. Never invent stats. If asked to change a pick, edit code, or do anything beyond answering questions, explain clearly that this chat is read-only and cannot modify anything - point them to the project if they want changes made.`;

function buildContext(){
  return `${METHODOLOGY}

Today's date: ${ASSISTANT_DATA.asOf}
Today's logged Beat the Streak picks (rank, name, combined hit probability, grade): ${JSON.stringify(ASSISTANT_DATA.todaysPicks)}
Beat the Streak stats (all_time and by model version): ${JSON.stringify(ASSISTANT_DATA.streakByVersion)}
Top 20 qualified hitters by Approach right now: ${JSON.stringify(ASSISTANT_DATA.topLeaders)}

MLB Game Picks - upcoming/most recent slate (${ASSISTANT_DATA.mlbGamePicks.asOf ?? 'none scheduled'}): ${JSON.stringify(ASSISTANT_DATA.mlbGamePicks.upcomingPicks)}
MLB Game Picks stats (all_time and by model version): ${JSON.stringify(ASSISTANT_DATA.mlbGamePicks.summaryByVersion)}
MLB Game Picks - last 8 resolved games: ${JSON.stringify(ASSISTANT_DATA.mlbGamePicks.recentHistory)}

NFL Game Picks - upcoming/most recent slate (${ASSISTANT_DATA.nflGamePicks.asOf ?? 'none scheduled'}): ${JSON.stringify(ASSISTANT_DATA.nflGamePicks.upcomingPicks)}
NFL Game Picks stats (all_time and by model version): ${JSON.stringify(ASSISTANT_DATA.nflGamePicks.summaryByVersion)}
NFL Game Picks - last 8 resolved games: ${JSON.stringify(ASSISTANT_DATA.nflGamePicks.recentHistory)}

Answer the visitor's questions using this data and your tools. Be concise, specific, and honest about uncertainty (cite the Wilson CI / sample size when relevant). Format stats compactly. This is your standing context for the whole conversation - the next message is the visitor's first question.`;
}

function searchPlayer(query){
  const q = String(query).toLowerCase();
  return ASSISTANT_DATA.allQualified.filter(p => p.name.toLowerCase().includes(q)).slice(0, 5);
}
function listPlayers({ team, sortBy, order, limit } = {}){
  let rows = ASSISTANT_DATA.allQualified;
  if (team) rows = rows.filter(p => p.team.toLowerCase() === String(team).toLowerCase());
  const key = ['Approach','WAVE','Game_Hit_Probability','PA','avg_batting_order','start_rate'].includes(sortBy) ? sortBy : 'Approach';
  const dir = order === 'asc' ? 1 : -1;
  rows = [...rows].sort((a,b) => (a[key] - b[key]) * dir);
  return rows.slice(0, Math.min(Number(limit) || 10, 25));
}
function listRecentGamePicks({ sport, team, limit } = {}){
  const source = String(sport).toLowerCase() === 'nfl' ? ASSISTANT_DATA.nflGamePicks : ASSISTANT_DATA.mlbGamePicks;
  let rows = source.fullHistory;
  if (team) rows = rows.filter(g => g.home_team === team || g.away_team === team);
  return rows.slice(0, Math.min(Number(limit) || 10, 25));
}

const tools = [
  {
    name: 'searchPlayer',
    description: 'Look up a specific qualified hitter by name (case-insensitive, partial match). Returns up to 5 matches with team, WAVE, Game_Hit_Probability, Approach, PA, avg_batting_order, start_rate.',
    inputSchema: { type: 'object', properties: { name: { type: 'string' } }, required: ['name'] },
    execute: ({ name }) => searchPlayer(name),
  },
  {
    name: 'listPlayers',
    description: 'List qualified hitters filtered by team and/or sorted by a stat. Use for "who is hot on team X", "who bats highest in the order", etc. Returns up to `limit` (max 25) rows.',
    inputSchema: {
      type: 'object',
      properties: {
        team: { type: 'string', description: '3-letter team code, e.g. NYY. Omit for all teams.' },
        sortBy: { type: 'string', enum: ['Approach','WAVE','Game_Hit_Probability','PA','avg_batting_order','start_rate'] },
        order: { type: 'string', enum: ['asc','desc'] },
        limit: { type: 'number' },
      },
    },
    execute: (input) => listPlayers(input),
  },
  {
    name: 'listRecentGamePicks',
    description: 'List recent/historical MLB or NFL Automated Game Picks (each with home/away team, predicted winner, probability, bet info, and real win/loss status). Use for "how has the model done on the Yankees lately", "show recent NFL picks", record-tracking questions, etc. Returns up to `limit` (max 25) rows, most recent first.',
    inputSchema: {
      type: 'object',
      properties: {
        sport: { type: 'string', enum: ['mlb','nfl'], description: 'Required.' },
        team: { type: 'string', description: '3-letter (MLB) or team code (NFL), e.g. NYY or KC. Omit for all teams.' },
        limit: { type: 'number' },
      },
      required: ['sport'],
    },
    execute: (input) => listRecentGamePicks(input),
  },
];

let turns = [];
let sample = null;
let toolsAvailable = false;
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('send');
const noticeEl = document.getElementById('notice');
const suggestionsEl = document.getElementById('suggestions');

function addMessage(role, text){
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.innerHTML = `<div class="bubble">${esc(text)}</div>`;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div.querySelector('.bubble');
}

const SUGGESTIONS = [
  "Why did today's picks get chosen?",
  "How does Expected_PA work?",
  "What are today's MLB Game Picks?",
  "How accurate are the NFL picks so far?",
];

function renderSuggestions(){
  suggestionsEl.innerHTML = SUGGESTIONS.map(s => `<span class="suggestion">${esc(s)}</span>`).join('');
  suggestionsEl.querySelectorAll('.suggestion').forEach((el, i) => {
    el.onclick = () => { inputEl.value = SUGGESTIONS[i]; ask(); };
  });
}

async function ask(){
  const text = inputEl.value.trim();
  if (!text || !sample) return;
  inputEl.value = '';
  sendBtn.disabled = true;
  suggestionsEl.hidden = true;
  addMessage('user', text);

  const isFirst = turns.length === 0;
  turns.push({ role: 'user', content: isFirst ? buildContext() + '\n\nVisitor: ' + text : text });

  const bubble = addMessage('assistant', 'Thinking…');
  bubble.classList.add('thinking');
  let started = false;

  try {
    const { text: answer } = await sample(turns, {
      ...(toolsAvailable ? { tools } : {}),
      cache: false,
      onText: ({ text }) => {
        if (!started) { bubble.classList.remove('thinking'); started = true; }
        bubble.textContent = text;
        messagesEl.scrollTop = messagesEl.scrollHeight;
      },
    });
    turns.push({ role: 'assistant', content: answer });
  } catch (e) {
    bubble.classList.remove('thinking');
    const copy = {
      not_granted: "You'll need to allow this artifact to use Claude to chat — try asking again.",
      rate_limited: "Too many questions at once — give it a moment and try again.",
      session_expired: "Your Claude session expired — refresh and sign in again.",
      refused: "Claude declined to answer that one — try rephrasing.",
      prompt_too_large: "That's too much for one question — try asking about fewer things at once.",
    }[e.code] || "Something went wrong answering that — try again.";
    bubble.textContent = e.text || copy;
    if (e.text) bubble.textContent += '\n\n(' + copy + ')';
    turns.pop();
  } finally {
    sendBtn.disabled = false;
    inputEl.focus();
  }
}

sendBtn.onclick = ask;
inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ask(); }
});

(async () => {
  try {
    sample = (await window.claude?.use('sample')) ?? null;
  } catch { sample = null; }

  if (!sample) {
    document.querySelector('.chat-panel').innerHTML =
      '<div class="fallback"><strong>Chat isn\'t available here.</strong><br>Open this page on claude.ai and sign in to ask questions about the data.</div>';
    noticeEl.textContent = '';
    return;
  }
  try {
    toolsAvailable = Boolean((await sample.limits())?.tools);
  } catch { toolsAvailable = false; }
  renderSuggestions();
  noticeEl.textContent = 'Chat uses your own Claude account — each question uses a bit of your usage. This page is a read-only assistant; it never edits the picks or the underlying model.';
})();
</script>
