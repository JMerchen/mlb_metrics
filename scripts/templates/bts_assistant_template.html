<title>Beat the Streak Assistant</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#faf7f2;
  --bg-raised:#ffffff;
  --bg-card:#f3ede2;
  --bg-hover:#ece4d5;
  --border:#e2d9c8;
  --border-strong:#cfc2a8;
  --text:#1c1a16;
  --text-dim:#6b6459;
  --accent:#c97b1f;
  --accent-strong:#a8630f;
  --on-accent:#fffaf2;
  --success:#1f8f5f;
  --danger:#c53a30;
  --radius:10px;
  --radius-sm:6px;
  --font:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b0d10;
    --bg-raised:#14171c;
    --bg-card:#1a1e25;
    --bg-hover:#20242c;
    --border:#262b34;
    --border-strong:#3a4150;
    --text:#eef1f5;
    --text-dim:#9aa1ac;
    --accent:#f2a93c;
    --accent-strong:#ffc266;
    --on-accent:#1a1206;
    --success:#3ecf8e;
    --danger:#f0554f;
  }
}
:root[data-theme="dark"]{
  --bg:#0b0d10;
  --bg-raised:#14171c;
  --bg-card:#1a1e25;
  --bg-hover:#20242c;
  --border:#262b34;
  --border-strong:#3a4150;
  --text:#eef1f5;
  --text-dim:#9aa1ac;
  --accent:#f2a93c;
  --accent-strong:#ffc266;
  --on-accent:#1a1206;
  --success:#3ecf8e;
  --danger:#f0554f;
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--bg);
  background-image:radial-gradient(circle at 15% 0%, rgba(201,123,31,.07), transparent 45%);
  color:var(--text);
  font-family:var(--font);
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:760px;margin:0 auto;padding:28px 20px 60px;}

header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:6px;flex-wrap:wrap;}
h1{font-size:22px;font-weight:700;letter-spacing:-.01em;margin:0;}
.asof{font-family:var(--font-mono);font-size:12px;color:var(--text-dim);}
.subtitle{color:var(--text-dim);font-size:14px;margin:2px 0 22px;max-width:60ch;line-height:1.5;}

.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:22px;}
.stat{background:var(--bg-raised);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;}
.stat .label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-dim);margin-bottom:6px;}
.stat .value{font-family:var(--font-mono);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1;}
.stat .sub{font-family:var(--font-mono);font-size:11px;color:var(--text-dim);margin-top:5px;}

.panel{background:var(--bg-raised);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:18px;overflow:hidden;}
.panel-head{padding:11px 16px;border-bottom:1px solid var(--border);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--text-dim);}
.picks{display:flex;flex-direction:column;}
.pick{display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid var(--border);}
.pick:last-child{border-bottom:none;}
.pick .rank{font-family:var(--font-mono);font-size:12px;color:var(--text-dim);width:16px;}
.pick .name{font-weight:600;flex:1;min-width:0;}
.pick .prob{font-family:var(--font-mono);font-size:13px;font-variant-numeric:tabular-nums;color:var(--text-dim);}
.grade{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.04em;padding:3px 7px;border-radius:20px;border:1px solid var(--border-strong);}
.grade.recommended{color:var(--success);border-color:var(--success);}
.grade.speculative{color:var(--text-dim);}

.chat-panel{display:flex;flex-direction:column;height:460px;}
#messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;}
.msg{display:flex;flex-direction:column;gap:4px;max-width:85%;}
.msg.user{align-self:flex-end;align-items:flex-end;}
.msg.assistant{align-self:flex-start;align-items:flex-start;}
.bubble{padding:10px 13px;border-radius:12px;font-size:14px;line-height:1.5;white-space:pre-wrap;}
.msg.user .bubble{background:var(--accent);color:var(--on-accent);border-bottom-right-radius:3px;}
.msg.assistant .bubble{background:var(--bg-card);border:1px solid var(--border);border-bottom-left-radius:3px;}
.msg.assistant .bubble.thinking{color:var(--text-dim);font-style:italic;}
.msg.assistant .bubble code{font-family:var(--font-mono);font-size:.92em;background:var(--bg-hover);padding:1px 4px;border-radius:4px;}

.suggestions{display:flex;gap:8px;flex-wrap:wrap;padding:0 16px 12px;}
.suggestion{font-family:var(--font-mono);font-size:12px;background:var(--bg-card);border:1px solid var(--border);border-radius:20px;padding:6px 12px;cursor:pointer;color:var(--text-dim);transition:border-color .15s ease,color .15s ease;}
.suggestion:hover{border-color:var(--accent);color:var(--text);}

.composer{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--border);}
#input{flex:1;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;color:var(--text);font-family:var(--font);font-size:14px;resize:none;}
#input:focus{outline:none;border-color:var(--accent);}
#send{font-family:var(--font);font-weight:600;font-size:13px;background:var(--accent);color:var(--on-accent);border:none;border-radius:var(--radius-sm);padding:0 18px;cursor:pointer;transition:background .15s ease;}
#send:hover{background:var(--accent-strong);}
#send:disabled{opacity:.5;cursor:default;}

.notice{font-size:12px;color:var(--text-dim);text-align:center;padding:10px 16px 0;line-height:1.5;}
.fallback{padding:40px 20px;text-align:center;color:var(--text-dim);}
.fallback strong{color:var(--text);}
[hidden]{display:none!important;}
::-webkit-scrollbar{width:8px;}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:8px;}
</style>

<div class="wrap">
  <header>
    <h1>Beat the Streak Assistant</h1>
    <span class="asof" id="asof-badge"></span>
  </header>
  <p class="subtitle">Ask about today's picks, WAVE/PAVE stats, or how the model works — grounded in the site's real, currently-live data. Read-only: it can discuss the picks, never change them.</p>

  <div class="stat-row" id="stat-row"></div>

  <div class="panel">
    <div class="panel-head">Today's Picks</div>
    <div class="picks" id="picks-list"></div>
  </div>

  <div class="panel chat-panel">
    <div class="panel-head">Ask the Assistant</div>
    <div id="messages"></div>
    <div class="suggestions" id="suggestions"></div>
    <div class="composer">
      <textarea id="input" rows="1" placeholder="Ask about a player, today's picks, or the model..."></textarea>
      <button id="send">Ask</button>
    </div>
  </div>

  <p class="notice" id="notice"></p>
</div>

<script>
const DATA = /*__DATA_JSON__*/{}/*__END_DATA_JSON__*/;

function fmtPct(x){ return (x*100).toFixed(1) + '%'; }
function esc(s){ return String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

function renderStats(){
  const all = DATA.streakSummary[0];
  const top = DATA.topLeaders[0];
  const tiles = [
    { label: 'Current Streak', value: all.current_streak, sub: 'picks in a row' },
    { label: 'Longest Streak', value: all.longest_streak, sub: 'all-time best' },
    { label: 'Day Survival Rate', value: fmtPct(all.day_survival_rate), sub: `${(all.day_survival_rate_ci_low*100).toFixed(0)}–${(all.day_survival_rate_ci_high*100).toFixed(0)}% CI, n=${all.n_days_resolved}` },
    { label: "Today's Top Approach", value: top.name.split(' ').pop(), sub: `${top.team} · ${fmtPct(top.Game_Hit_Probability)} GHP` },
  ];
  document.getElementById('stat-row').innerHTML = tiles.map(t =>
    `<div class="stat"><div class="label">${esc(t.label)}</div><div class="value">${esc(t.value)}</div><div class="sub">${esc(t.sub)}</div></div>`
  ).join('');
}

function renderPicks(){
  document.getElementById('picks-list').innerHTML = DATA.todaysPicks.map(p => `
    <div class="pick">
      <span class="rank">#${p.rank}</span>
      <span class="name">${esc(p.name)}</span>
      <span class="prob">${fmtPct(p.combined_probability)}</span>
      <span class="grade ${p.grade}">${p.grade === 'recommended' ? 'Recommended' : 'Speculative'}</span>
    </div>
  `).join('') || '<div class="pick"><span class="name">No picks logged yet today.</span></div>';
}

document.getElementById('asof-badge').textContent = 'as of ' + DATA.asOf;
renderStats();
renderPicks();

// --- Chat ---
const METHODOLOGY = `This is the Beat the Streak picker for a real MLB stats project. Key terms:
- WAVE: a recency-weighted at-bat-level hit rate for a batter, blended across several rolling windows (10/30/81 games and full season).
- PAVE: the pitcher equivalent - how often batters get hits against them, at-bat level.
- Game_Hit_Probability: the batter's REAL season-long observed rate of games with at least one hit (empirical, not modeled).
- Approach: Game_Hit_Probability x a WAVE-derived per-game hit probability - the main ranking score for a hitter's own form.
- Matchup_Approach: Approach adjusted for today's specific probable-pitcher matchup (a log5 blend of the batter's WAVE against that pitcher's PAVE).
- avg_batting_order / start_rate: where a batter has recently hit in the lineup, and how consistently they start.
- Wilson confidence interval: a statistically honest range for a rate, given how many real days/picks it's based on - wide with few samples, narrow with many.
- day_survival_rate: how often the day's picks (usually 2) both got a hit, i.e. would have extended a real Beat the Streak run.

Recent real finding (Sept 2026, a full-season no-lookahead backtest across 153 real dates): the automated picker's old rule excluding any batter who didn't bat in the top half of the lineup was actively hurting accuracy - batters it excluded hit 73% afterward vs 66% for the ones it kept (e.g. Javier Sanoja: hits well, bats 6th-7th for Miami, was wrongly excluded despite starting 85%+ of games). That hard rule was removed. In its place, a batter's recent lineup slot is now converted into a real, data-derived Expected_PA (leadoff hitters really do get more at-bats than #9 hitters), blended INTO the hit-probability math instead of used as a cutoff - "more expected at-bats = more chances at a hit, even at a slightly lower average." The first version used that estimate at full strength, but a 35,000-hitter-day validation found it overcorrected (real at-bats vary game to game, so a fixed number was too confident) - the shipped version blends only 30% of the raw estimate with the old flat assumption, which tested as a real, statistically significant calibration improvement (Brier score 0.2429 vs 0.2434, p<0.0001).

You have two tools to look up real current data beyond what's already given to you: searchPlayer and listPlayers. Use them for any specific player or filtered/sorted question rather than guessing. Never invent stats. If asked to change a pick, edit code, or do anything beyond answering questions, explain clearly that this chat is read-only and cannot modify anything - point them to the project if they want changes made.`;

function buildContext(){
  return `${METHODOLOGY}

Today's date: ${DATA.asOf}
Today's logged picks (rank, name, combined hit probability, grade): ${JSON.stringify(DATA.todaysPicks)}
Streak stats (all_time and by model version): ${JSON.stringify(DATA.streakByVersion)}
Top 20 qualified hitters by Approach right now: ${JSON.stringify(DATA.topLeaders)}

Answer the visitor's questions using this data and your tools. Be concise, specific, and honest about uncertainty (cite the Wilson CI / sample size when relevant). Format player stats compactly. This is your standing context for the whole conversation - the next message is the visitor's first question.`;
}

function searchPlayer(query){
  const q = String(query).toLowerCase();
  return DATA.allQualified.filter(p => p.name.toLowerCase().includes(q)).slice(0, 5);
}
function listPlayers({ team, sortBy, order, limit } = {}){
  let rows = DATA.allQualified;
  if (team) rows = rows.filter(p => p.team.toLowerCase() === String(team).toLowerCase());
  const key = ['Approach','WAVE','Game_Hit_Probability','PA','avg_batting_order','start_rate'].includes(sortBy) ? sortBy : 'Approach';
  const dir = order === 'asc' ? 1 : -1;
  rows = [...rows].sort((a,b) => (a[key] - b[key]) * dir);
  return rows.slice(0, Math.min(Number(limit) || 10, 25));
}

const tools = [
  {
    name: 'searchPlayer',
    description: 'Look up a specific qualified hitter by name (case-insensitive, partial match). Returns up to 5 matches with team, WAVE, Game_Hit_Probability, Approach, PA, avg_batting_order, start_rate.',
    inputSchema: { type: 'object', properties: { name: { type: 'string' } }, required: ['name'] },
    execute: ({ name }) => searchPlayer(name),
  },
  {
    name: 'listPlayers',
    description: 'List qualified hitters filtered by team and/or sorted by a stat. Use for "who is hot on team X", "who bats highest in the order", etc. Returns up to `limit` (max 25) rows.',
    inputSchema: {
      type: 'object',
      properties: {
        team: { type: 'string', description: '3-letter team code, e.g. NYY. Omit for all teams.' },
        sortBy: { type: 'string', enum: ['Approach','WAVE','Game_Hit_Probability','PA','avg_batting_order','start_rate'] },
        order: { type: 'string', enum: ['asc','desc'] },
        limit: { type: 'number' },
      },
    },
    execute: (input) => listPlayers(input),
  },
];

let turns = [];
let sample = null;
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('send');
const noticeEl = document.getElementById('notice');
const suggestionsEl = document.getElementById('suggestions');

function addMessage(role, text){
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.innerHTML = `<div class="bubble">${esc(text)}</div>`;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div.querySelector('.bubble');
}

const SUGGESTIONS = [
  "Why did today's picks get chosen?",
  "How does Expected_PA work?",
  "Who's hot on my favorite team?",
  "What's the current streak?",
];

function renderSuggestions(){
  suggestionsEl.innerHTML = SUGGESTIONS.map(s => `<span class="suggestion">${esc(s)}</span>`).join('');
  suggestionsEl.querySelectorAll('.suggestion').forEach((el, i) => {
    el.onclick = () => { inputEl.value = SUGGESTIONS[i]; ask(); };
  });
}

async function ask(){
  const text = inputEl.value.trim();
  if (!text || !sample) return;
  inputEl.value = '';
  sendBtn.disabled = true;
  suggestionsEl.hidden = true;
  addMessage('user', text);

  const isFirst = turns.length === 0;
  turns.push({ role: 'user', content: isFirst ? buildContext() + '\n\nVisitor: ' + text : text });

  const bubble = addMessage('assistant', 'Thinking…');
  bubble.classList.add('thinking');
  let started = false;

  try {
    const { text: answer } = await sample(turns, {
      tools,
      cache: false,
      onText: ({ text }) => {
        if (!started) { bubble.classList.remove('thinking'); started = true; }
        bubble.textContent = text;
        messagesEl.scrollTop = messagesEl.scrollHeight;
      },
    });
    turns.push({ role: 'assistant', content: answer });
  } catch (e) {
    bubble.classList.remove('thinking');
    const copy = {
      not_granted: "You'll need to allow this artifact to use Claude to chat — try asking again.",
      rate_limited: "Too many questions at once — give it a moment and try again.",
      session_expired: "Your Claude session expired — refresh and sign in again.",
      refused: "Claude declined to answer that one — try rephrasing.",
      prompt_too_large: "That's too much for one question — try asking about fewer things at once.",
    }[e.code] || "Something went wrong answering that — try again.";
    bubble.textContent = e.text || copy;
    if (e.text) bubble.textContent += '\n\n(' + copy + ')';
    turns.pop();
  } finally {
    sendBtn.disabled = false;
    inputEl.focus();
  }
}

sendBtn.onclick = ask;
inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ask(); }
});

(async () => {
  try {
    sample = (await window.claude?.use('sample')) ?? null;
  } catch { sample = null; }

  if (!sample) {
    document.querySelector('.chat-panel').innerHTML =
      '<div class="fallback"><strong>Chat isn\'t available here.</strong><br>Open this page on claude.ai and sign in to ask questions about the data.</div>';
    noticeEl.textContent = '';
    return;
  }
  renderSuggestions();
  noticeEl.textContent = 'Chat uses your own Claude account — each question uses a bit of your usage. This page is a read-only assistant; it never edits the picks or the underlying model.';
})();
</script>
