<!--__PAGE_SCRIPTS__-->

<script>
function selectSitePage(page){
document.querySelectorAll('#sitePageTabs .tabButton').forEach(function(btn){
btn.classList.toggle('active', btn.dataset.sitePage === page)
})
document.querySelectorAll('.sitePage').forEach(function(section){
section.hidden = section.id !== ('page-' + page)
})
}

function selectMlbSubpage(sub){
document.querySelectorAll('#mlbSubTabs .tabButton').forEach(function(btn){
btn.classList.toggle('active', btn.dataset.mlbSub === sub)
})
document.querySelectorAll('.mlbSubpage').forEach(function(section){
section.hidden = section.id !== ('mlb-' + sub)
})
}
</script>
