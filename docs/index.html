<!DOCTYPE html>

<html>

<head>

<meta charset="utf-8">

<title>MLB Metrics</title>

<link
rel="stylesheet"
href="./style.css">

</head>

<body>

<div class="container">

<h1>
MLB Metrics
</h1>

<div class="leaderboards">

<div>

<h2>
Top WAVE Players
</h2>

<div
class="scrollbox"
id="waveTable">

Loading...

</div>

</div>

<div>

<h2>
Top PAVE Players
</h2>

<div
class="scrollbox"
id="paveTable">

Loading...

</div>

</div>

</div>

<hr>

<h2>
Player Search
</h2>

<select id="playerType">

<option value="wave">

Hitter (WAVE)

</option>

<option value="pave">

Pitcher (PAVE)

</option>

</select>

<input
id="playerSearch"
placeholder="Search player">

<button onclick="searchPlayer()">

Search

</button>

<div id="playerChoices">

</div>

<br>

<div id="playerResult">

</div>

<hr>

<h2>
Team Confidence
</h2>

<div
id="teamButtons">

Loading...

</div>

<br>

<div
id="teamResult">

Select a team

</div>

<hr>

<h2>
Series Odds
</h2>

<select id="teamA">

</select>

<label>
Starter A
</label>

<select id="pitcherA">

</select>

<select id="teamB">

</select>

<label>
Starter B
</label>

<select id="pitcherB">

</select>

<button>

Predict

</button>

<div id="oddsResult">

Choose teams

</div>

<br>

<button
onclick="predictOdds()">

Calculate Odds

</button>

</div>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<script src="./app.js"></script>

</body>

</html>
