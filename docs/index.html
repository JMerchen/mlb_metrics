<!DOCTYPE html>

<html>

<head>

<meta charset="utf-8">

<title>MLB Metrics</title>

<link
rel="stylesheet"
href="./style.css">

</head>

<body>

<div class="container">

<h1>
MLB Metrics
</h1>

<div class="leaderboards">

<div>

<h2>
Top WAVE Players
</h2>

<div
class="scrollbox"
id="waveTable">

Loading...

</div>

</div>

<div>

<h2>
Top PAVE Players
</h2>

<div
class="scrollbox"
id="paveTable">

Loading...

</div>

</div>

</div>

<hr>

<h2>
Player Search
</h2>

<select id="playerType">

<option value="wave">

Hitter (WAVE)

</option>

<option value="pave">

Pitcher (PAVE)

</option>

</select>

<input
id="playerSearch"
placeholder="Search player">

<button onclick="searchPlayer()">

Search

</button>

<div id="playerChoices">

</div>

<br>

<div id="playerResult">

</div>

<hr>

<h2>
Team Confidence
</h2>

<div
id="teamButtons">

Loading...

</div>

<br>

<div
id="teamResult">

Select a team

</div>

<hr>

<h2>
Game Odds
</h2>

<div class="matchup">

<div>

<h3>

Home Team

</h3>

<select id="teamA">

</select>

<div
class="scrollbox hitterbox"
id="teamAHitters">

Select team

</div>

<br><br>

<input
id="pitcherSearchA"
placeholder="Search starter">

<button
onclick="searchPitcher('A')">

Search

</button>

<div
id="pitcherChoicesA">

</div>

<div
id="pitcherSelectedA">

League Average

</div>

<div
id="pitcherStatsA">

</div>

</div>

<div>

<h3>

Away Team

</h3>

<select id="teamB">

</select>

<div
class="scrollbox hitterbox"
id="teamBHitters">

Select team

</div>

<br><br>

<input
id="pitcherSearchB"
placeholder="Search starter">

<button
onclick="searchPitcher('B')">

Search

</button>

<div
id="pitcherChoicesB">

</div>

<div
id="pitcherSelectedB">

League Average

</div>

<div
id="pitcherStatsB">

</div>

</div>

</div>

<br>

<button
onclick="predictOdds()">

Predict

</button>

<div id="oddsResult">

<h3>

Projected Hitters

</h3>

<div
class="matchup">

<div>

<h4>

Home Team

</h4>

<div
id="teamAHitters">

</div>

</div>

<div>

<h4>

Away Team

</h4>

<div
id="teamBHitters">

</div>

</div>

<br>

</div>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<script src="./app.js"></script>

</body>

</html>
